name: Sync Controle Assinaturas (Autentique)

# Sincroniza somente Autentique → Monday Controle Assinaturas (sem Drive/Contratos).
# Agendado + push em main: somente comparação (sem writes). Sync explícito via workflow_dispatch.
on:
  schedule:
    - cron: "15 * * * *"
  push:
    branches:
      - main
    paths:
      - "src/classificacao_procons/contratos/**"
      - ".github/workflows/contratos-sync-controle.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "compare | repair | reconcile-mismatches | sync"
        required: true
        type: choice
        options:
          - compare
          - repair
          - reconcile-mismatches
          - sync
        default: compare
      dry_run:
        description: "Simular sync ou repair (não grava no Monday)"
        required: false
        type: boolean
        default: true
      max_pages:
        description: "Páginas do Autentique (60 docs por página)"
        required: false
        type: string
        default: "50"
      create_only:
        description: "Não atualiza itens existentes no Monday"
        required: false
        type: boolean
        default: true
      skip_signed_documents:
        description: "Não importa documentos já 100% assinados (evita status Assinado)"
        required: false
        type: boolean
        default: true
      pilot_bruno_distrato:
        description: "Após sync: rodar pilot-controle-bruno-distrato (título com (2))"
        required: false
        type: boolean
        default: false
      pilot_bruno_dry_run:
        description: "Simular piloto Bruno (sem writes no Monday)"
        required: false
        type: boolean
        default: false
      validate_status_labels:
        description: "Validar labels da coluna Status no Monday"
        required: false
        type: boolean
        default: false
      allow_create:
        description: "Sync: permite criar itens faltantes no Controle (--allow-create)"
        required: false
        type: boolean
        default: false
      light_autentique_feed:
        description: "reconcile-mismatches: buscar só IDs já no link do Monday"
        required: false
        type: boolean
        default: false

concurrency:
  group: contratos-sync-controle
  cancel-in-progress: false

jobs:
  sync-controle:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Set workflow parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "mode=compare" >> "$GITHUB_OUTPUT"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "max_pages=50" >> "$GITHUB_OUTPUT"
            echo "create_only=true" >> "$GITHUB_OUTPUT"
            echo "skip_signed_documents=true" >> "$GITHUB_OUTPUT"
            echo "allow_create=false" >> "$GITHUB_OUTPUT"
            echo "light_autentique_feed=false" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            echo "max_pages=${{ inputs.max_pages }}" >> "$GITHUB_OUTPUT"
            echo "create_only=${{ inputs.create_only }}" >> "$GITHUB_OUTPUT"
            echo "skip_signed_documents=${{ inputs.skip_signed_documents }}" >> "$GITHUB_OUTPUT"
            echo "allow_create=${{ inputs.allow_create }}" >> "$GITHUB_OUTPUT"
            echo "light_autentique_feed=${{ inputs.light_autentique_feed }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install .

      - name: Validate secrets
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          AUTENTIQUE_API_TOKEN: ${{ secrets.AUTENTIQUE_API_TOKEN }}
        run: |
          for name in MONDAY_API_TOKEN AUTENTIQUE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "Secret ausente: $name"
              exit 1
            fi
          done

      - name: Compare Autentique x Controle
        if: ${{ steps.params.outputs.mode == 'compare' }}
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          AUTENTIQUE_API_TOKEN: ${{ secrets.AUTENTIQUE_API_TOKEN }}
        run: |
          contratos-webhook compare-controle \
            --max-pages "${{ steps.params.outputs.max_pages }}" \
            --export-pending-json pending-export.json

      - name: Upload pending export
        if: ${{ steps.params.outputs.mode == 'compare' }}
        uses: actions/upload-artifact@v4
        with:
          name: controle-pending-export
          path: pending-export.json
          if-no-files-found: ignore

      - name: Repair canonical Autentique links (Controle)
        if: ${{ steps.params.outputs.mode == 'repair' }}
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          AUTENTIQUE_API_TOKEN: ${{ secrets.AUTENTIQUE_API_TOKEN }}
        run: |
          ARGS="--max-pages ${{ steps.params.outputs.max_pages }}"
          if [ "${{ steps.params.outputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          contratos-webhook repair-controle-autentique-links $ARGS

      - name: Reconcile compare mismatches (Controle)
        if: ${{ steps.params.outputs.mode == 'reconcile-mismatches' }}
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          AUTENTIQUE_API_TOKEN: ${{ secrets.AUTENTIQUE_API_TOKEN }}
        run: |
          ARGS="--max-pages ${{ steps.params.outputs.max_pages }}"
          if [ "${{ steps.params.outputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ steps.params.outputs.light_autentique_feed }}" = "true" ]; then
            ARGS="$ARGS --light-feed"
          fi
          contratos-webhook reconcile-controle-mismatches $ARGS

      - name: Sync Controle Assinaturas
        if: ${{ steps.params.outputs.mode == 'sync' }}
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          AUTENTIQUE_API_TOKEN: ${{ secrets.AUTENTIQUE_API_TOKEN }}
          CONTROLE_PAUSE_CREATE: ${{ steps.params.outputs.allow_create == 'true' && 'false' || 'true' }}
        run: |
          ARGS="--max-pages ${{ steps.params.outputs.max_pages }}"
          if [ "${{ steps.params.outputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ steps.params.outputs.create_only }}" = "true" ]; then
            ARGS="$ARGS --create-only"
          fi
          if [ "${{ steps.params.outputs.skip_signed_documents }}" = "true" ]; then
            ARGS="$ARGS --skip-signed-documents"
          fi
          if [ "${{ steps.params.outputs.allow_create }}" = "true" ]; then
            ARGS="$ARGS --allow-create"
          fi
          contratos-webhook sync-controle $ARGS

      - name: Validate Controle status labels
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.validate_status_labels == true
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: contratos-webhook validate-controle-status-labels

      - name: Pilot Bruno distrato (2)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.pilot_bruno_distrato == true
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          AUTENTIQUE_API_TOKEN: ${{ secrets.AUTENTIQUE_API_TOKEN }}
          CONTROLE_PAUSE_CREATE: "false"
        run: |
          ARGS=""
          if [ "${{ inputs.pilot_bruno_dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          contratos-webhook pilot-controle-bruno-distrato $ARGS
