name: Vincular legado Controle (Autentique ID)

on:
  workflow_dispatch:
    inputs:
      monday_item_id:
        description: "ID do item no Monday Controle Assinaturas"
        required: true
        type: string
      document_id:
        description: "Autentique document ID"
        required: true
        type: string
      dry_run:
        description: "Só validar (não grava)"
        required: false
        type: boolean
        default: false

jobs:
  link-controle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Link Autentique ID on Controle item
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: |
          ARGS="--monday-item-id ${{ inputs.monday_item_id }} --document-id ${{ inputs.document_id }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          contratos-webhook link-controle $ARGS
