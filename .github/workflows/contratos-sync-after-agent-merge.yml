name: Controle sync after agent merge

# Dispara sync-controle após merge de PR cursor/* que altere contratos (push sozinho nem sempre roda).
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  dispatch-sync-controle:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'cursor/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch Sync Controle when contratos paths changed
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = context.payload.pull_request.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });

            const prefixes = [
              "src/classificacao_procons/contratos/",
              ".github/workflows/contratos-",
            ];
            const touched = files.some((file) =>
              prefixes.some(
                (prefix) => file.filename === prefix || file.filename.startsWith(prefix),
              ),
            );

            if (!touched) {
              core.info("PR não alterou contratos; sync Controle não disparado.");
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "contratos-sync-controle.yml",
              ref: "main",
              inputs: {
                mode: "sync",
                dry_run: false,
                max_pages: "50",
                create_only: false,
                skip_signed_documents: true,
              },
            });
            core.info("Sync Controle Assinaturas disparado (reparo Jan/Luciano).");
