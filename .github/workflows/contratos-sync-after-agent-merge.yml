name: Controle sync after agent merge

# Roda sync-controle após merge de PR cursor/* que altere contratos (sem dispatch — GITHUB_TOKEN não dispara outros workflows).
on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contratos-sync-controle
  cancel-in-progress: false

jobs:
  sync-controle:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'cursor/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check whether PR touched contratos
        id: paths
        uses: actions/github-script@v7
        with:
          script: |
            const pullNumber = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const prefixes = [
              "src/classificacao_procons/contratos/",
              ".github/workflows/contratos-",
            ];
            const touched = files.some((file) =>
              prefixes.some(
                (prefix) => file.filename === prefix || file.filename.startsWith(prefix),
              ),
            );
            core.setOutput("touched", touched ? "true" : "false");
            if (!touched) {
              core.info("PR não alterou contratos; sync Controle ignorado.");
            }

      - name: Checkout
        if: steps.paths.outputs.touched == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.paths.outputs.touched == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        if: steps.paths.outputs.touched == 'true'
        run: pip install .

      - name: Validate secrets
        if: steps.paths.outputs.touched == 'true'
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          AUTENTIQUE_API_TOKEN: ${{ secrets.AUTENTIQUE_API_TOKEN }}
        run: |
          for name in MONDAY_API_TOKEN AUTENTIQUE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "Secret ausente: $name"
              exit 1
            fi
          done

      - name: Sync Controle Assinaturas (reparo Jan/Luciano)
        if: steps.paths.outputs.touched == 'true'
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          AUTENTIQUE_API_TOKEN: ${{ secrets.AUTENTIQUE_API_TOKEN }}
        run: |
          contratos-webhook sync-controle \
            --max-pages 50 \
            --skip-signed-documents
