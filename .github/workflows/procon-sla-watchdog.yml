name: Procon SLA watchdog

# Detecta e-mails de reclamação não lidos além do SLA e gaps no GitHub Actions.
# Em violação, dispara reprocessamento (process) quando GITHUB_ACTIONS_PAT está configurado.

concurrency:
  group: procon-sla-watchdog
  cancel-in-progress: false

on:
  schedule:
    # Entre as janelas do cron nativo (:00/:15/:30/:45) e do ping GCP (:00/:30).
    - cron: "5 * * * *"
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      max_age_minutes:
        description: "Alerta se e-mail não lido for mais antigo (minutos)"
        required: false
        default: "90"
      max_workflow_age_minutes:
        description: "Alerta se workflow Procon sem sucesso há mais que (minutos)"
        required: false
        default: "150"
      auto_remediate:
        description: "Disparar Procon automation (só process) se SLA violado"
        required: false
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install .

      - name: Configure Google credentials
        env:
          GMAIL_OAUTH_JSON: ${{ secrets.GMAIL_OAUTH_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          mkdir -p credentials
          printf '%s' "$GMAIL_OAUTH_JSON" > credentials/gmail-oauth.json
          printf '%s' "$GMAIL_TOKEN_JSON" > credentials/gmail-token.json

      - name: Validate Google credentials
        run: |
          python3 <<'PY'
          import json
          import sys
          from pathlib import Path

          from classificacao_procons.google_auth import has_valid_token

          for filename in ("gmail-oauth.json", "gmail-token.json"):
              path = Path("credentials") / filename
              if not path.exists() or path.stat().st_size < 10:
                  print(f"ERRO: {filename} ausente.")
                  sys.exit(1)
              json.loads(path.read_text())

          if not has_valid_token():
              print("ERRO: token Google inválido.")
              sys.exit(1)
          PY

      - name: SLA check (Gmail + GitHub Actions)
        env:
          GITHUB_ACTIONS_PAT: ${{ secrets.GITHUB_ACTIONS_PAT }}
        run: |
          MAX_EMAIL="${{ github.event.inputs.max_age_minutes }}"
          MAX_WORKFLOW="${{ github.event.inputs.max_workflow_age_minutes }}"
          python -m classificacao_procons.cli sla-check \
            --max-age-minutes "${MAX_EMAIL:-90}" \
            --max-workflow-age-minutes "${MAX_WORKFLOW:-150}"

  remediate:
    needs: check
    if: >-
      failure() && (
        github.event_name == 'schedule'
        || github.event.inputs.auto_remediate != 'false'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch Procon process
        env:
          GH_TOKEN: ${{ secrets.GITHUB_ACTIONS_PAT }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::GITHUB_ACTIONS_PAT ausente — não foi possível disparar reprocessamento."
            exit 1
          fi
          gh workflow run "Procon automation (every 30 min)" -f skip_elaborate=true
          echo "Reprocessamento disparado. Acompanhe em Actions → Procon automation."
